# pnpm-workspace.yaml
# Modern configuration home for pnpm v11+ dependency metrics

overrides:
  deepmerge-ts: ">=8.0.0"
  mysql2: ">=3.23.1"

allowBuilds:
  '@prisma/engines': true
  bcrypt: false        # Explicitly deactivated: using 'bcryptjs' (pure-JS implementation)
  esbuild: true
  prisma: true
  protobufjs: true     # FIXED: Whitelists the OpenTelemetry protobuf compiler to pass CI builds
