# pnpm-workspace.yaml
# Modern configuration home for pnpm v11+ dependency metrics

overrides:
  deepmerge-ts: ">=8.0.0"
  mysql2: ">=3.23.1"
  uuid: ">=11.1.1"
  "@opentelemetry/core": ">=2.8.0"
  protobufjs: ">=8.0.2"
  # FIXED: Universally patches the High-Severity Jaeger DoS vulnerability across meta-packages
  "@opentelemetry/propagator-jaeger": ">=2.9.0" 

allowBuilds:
  '@prisma/engines': true
  bcrypt: false
  esbuild: true
  prisma: true
  protobufjs: true
